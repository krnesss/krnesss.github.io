<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-label="AK-12 方案概览示例图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1219"/>
      <stop offset="1" stop-color="#070a0e"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#1b2431" stroke-width="1"/>
    </pattern>
    <linearGradient id="gun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb457"/>
      <stop offset="1" stop-color="#c26305"/>
    </linearGradient>
  </defs>

  <rect width="800" height="380" fill="url(#bg)"/>
  <rect width="800" height="380" fill="url(#grid)" opacity=".55"/>
  <rect x="0.5" y="0.5" width="799" height="379" fill="none" stroke="#263041"/>

  <text x="28" y="40" fill="#6b7a8d" font-family="monospace" font-size="13" letter-spacing="2">SCHEME OVERVIEW / 示例图</text>
  <text x="28" y="66" fill="#e7edf5" font-family="sans-serif" font-size="24" font-weight="700">AK-12</text>

  <!-- 枪械轮廓示意 -->
  <g fill="url(#gun)" stroke="#ffd9a8" stroke-width="1">
    <!-- 枪托 -->
    <path d="M96 176h74l14 10v18h-30l-10 16H96z"/>
    <!-- 机匣 -->
    <rect x="170" y="168" width="168" height="40" rx="5"/>
    <!-- 护木 -->
    <rect x="338" y="174" width="150" height="28" rx="6"/>
    <!-- 枪管 -->
    <rect x="488" y="184" width="196" height="9" rx="4"/>
    <!-- 枪口 -->
    <rect x="684" y="178" width="34" height="21" rx="4"/>
    <!-- 弹匣 -->
    <path d="M286 208h52v14l-14 62h-40l-8-58z"/>
    <!-- 握把 -->
    <path d="M232 208h30l-16 64h-30z"/>
    <!-- 瞄具 -->
    <rect x="248" y="146" width="118" height="20" rx="5"/>
    <rect x="286" y="166" width="14" height="10"/>
    <rect x="330" y="166" width="14" height="10"/>
  </g>

  <!-- 准星刻度 -->
  <g stroke="#ff8a1f" stroke-width="2" opacity=".85">
    <path d="M600 108h60M630 90v36M20 320h760"/>
  </g>

  <text x="28" y="352" fill="#9aa8bb" font-family="sans-serif" font-size="14">示例占位图 · 把本文件换成你导出的改枪方案截图即可，文件名随意</text>
  <text x="772" y="352" fill="#4a5666" font-family="monospace" font-size="13" text-anchor="end">save/AR/AK-12/1/</text>
</svg>
